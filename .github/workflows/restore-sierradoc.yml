name: Restore SIERRA public site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-sierradoc.yml'
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore known-good SIERRA deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured in this repository."
            exit 2
          fi
          # Known-good public deployment from the SIERRA site project.
          npx --yes vercel@58.1.0 rollback sierra-iva1qti69-janaas-projects-47034055.vercel.app --scope janaas-projects-47034055 --token "$VERCEL_TOKEN" --yes
